<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fx-any — run Vercel fx on any endpoint</title>
  <meta property="og:title" content="fx-any — run Vercel fx on any standards-based endpoint" />
  <meta property="og:description" content="A ~230-line shim that frees Vercel's fx coding agent from the AI Gateway — llama.cpp, Ollama, vLLM, OpenRouter, OpenAI. A shim, not a fork." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#05060b;--panel:#0f1117;--border:rgba(140,170,255,.12);--text:#e8edfb;--muted:#8592b0;--gold:#ffcf5c;--accent:#7cc4ff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(1000px 600px at 80% -10%,rgba(90,120,255,.14),transparent 60%),#05060b;color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;padding:32px 20px 80px}
    .wrap{max-width:900px;margin:0 auto}
    h1{font-family:'Sora';font-size:30px;font-weight:800;background:linear-gradient(120deg,#fff,#7cc4ff 55%,#b98cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .sub{color:var(--muted);margin:4px 0 22px;font-size:14px}
    .btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(120deg,var(--gold),#ffb638);color:#2a1e02;font-weight:700;border-radius:9px;padding:9px 16px;text-decoration:none;font-size:13px;margin:0 8px 8px 0}
    .btn.ghost{background:rgba(124,196,255,.08);border:1px solid var(--border);color:var(--accent)}
    .doc{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 30px;overflow:auto;margin-top:8px}
    .doc h1{font-size:23px;-webkit-text-fill-color:initial;background:none;color:#fff;margin:16px 0 10px}
    .doc h2{font-family:'Sora';font-size:18px;margin:22px 0 10px;color:#fff;border-bottom:1px solid var(--border);padding-bottom:6px}
    .doc h3{font-size:15px;margin:16px 0 8px;color:var(--accent)}
    .doc p,.doc li{color:#cdd6ea;font-size:14.5px;margin:8px 0}
    .doc ul,.doc ol{padding-left:22px}
    .doc code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px;color:#ffd98a;font-size:12.5px;font-family:'JetBrains Mono',monospace}
    .doc pre{background:#070a12;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;margin:12px 0}
    .doc pre code{background:none;color:#bcd0f0;padding:0}
    .doc a{color:var(--accent)}
    .doc table{border-collapse:collapse;margin:12px 0;width:100%}
    .doc th,.doc td{border:1px solid var(--border);padding:7px 10px;font-size:13px;text-align:left}
    .doc blockquote{border-left:3px solid var(--gold);padding:4px 14px;margin:12px 0;color:var(--muted);background:rgba(255,207,92,.05)}
    .foot{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>fx-any</h1>
    <p class="sub">Run Vercel's <code>fx</code> coding agent on any standards-based endpoint — a shim, not a fork.</p>
    <div style="margin-bottom:16px">
      <a class="btn" href="fx-any.zip" download>⬇ Download all (.zip)</a>
      <a class="btn ghost" href="server.js" target="_blank">server.js (the shim)</a>
      <a class="btn ghost" href="README.md" target="_blank">README.md</a>
      <a class="btn ghost" href="mock-openai.js" target="_blank">mock-openai.js</a>
      <a class="btn ghost" href="mock-tools.js" target="_blank">mock-tools.js</a>
      <a class="btn ghost" href="capture.js" target="_blank">capture.js</a>
    </div>
    <div class="doc" id="doc">Loading…</div>
    <div class="foot">Clean-room shim built from fx's public Apache-2.0 protocol. No fx code redistributed.</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('README.md').then(r=>r.text()).then(md=>{
      document.getElementById('doc').innerHTML = window.marked ? marked.parse(md) : '<pre>'+md.replace(/[<&]/g,c=>({'<':'&lt;','&':'&amp;'}[c]))+'</pre>';
    }).catch(()=>{document.getElementById('doc').textContent='Could not load README.md';});
  </script>
</body>
</html>
